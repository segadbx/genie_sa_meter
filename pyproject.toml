[project]
name = "genie-benchmark"
version = "0.1.0"
description = "Read-only benchmark and trace harness comparing direct Genie, Supervisor, and Supervisor+MCP invocation paths."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Databricks Field Engineering" }]

# Runtime dependencies. Each dependency is justified here per the PRD rule that no
# dependency is added without documenting why it is needed:
#   - pyyaml:         parse the YAML configuration contract (config.yaml).
#   - databricks-sdk: call the documented Genie Conversation API for the direct_genie adapter.
#   - mlflow:         MLflow Tracing for the harness boundary and trace/token normalization.
dependencies = [
    "pyyaml>=6.0.1,<7.0.0",
    "databricks-sdk>=0.30.0,<1.0.0",
    "mlflow>=2.15.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "types-PyYAML>=6.0.0",
]
# Optional extra for the demo bootstrap's supervisor_mcp path. The core adapters and the
# bootstrap itself use only databricks-sdk (already a runtime dep) via the SDK's REST client
# and the `databricks` CLI; this MCP client is needed only to exercise the managed Genie MCP
# transport for the supervisor_mcp variant. Without it, that variant reports its prerequisite.
bootstrap = [
    "databricks-mcp>=0.1.0",
]

[project.scripts]
benchmark = "genie_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genie_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `tests.conftest` imports work under `uv run pytest`
# (which, unlike `python -m pytest`, does not add the CWD automatically).
pythonpath = ["."]
# Integration tests are opt-in and skipped unless a customer supplies config + confirmation.
markers = [
    "integration: opt-in live tests; skipped unless GENIE_BENCHMARK_INTEGRATION=1 and a config is supplied",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks legitimately spread imports across cells (E402), reference
# notebook-injected globals such as dbutils/spark/display/displayHTML (F821), and end
# cells with a bare expression to render a value (B018).
"notebooks/*.py" = ["E402", "F821", "B018"]

[tool.mypy]
python_version = "3.10"
packages = ["genie_benchmark"]
mypy_path = "src"
warn_unused_ignores = true
no_implicit_optional = true

# mlflow and databricks-sdk are optional, lazily-imported runtime dependencies; do not
# fail type checking when their stubs are unavailable.
[[tool.mypy.overrides]]
module = ["mlflow.*", "databricks.*", "databricks_mcp.*"]
ignore_missing_imports = true
